<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座椅CMF评论分析仪表板</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 现代化配色系统 */
      --color-primary: #6366f1;
      --color-primary-light: #818cf8;
      --color-primary-dark: #4f46e5;
      --color-secondary: #0ea5e9;
      --color-accent: #f43f5e;
      --color-success: #10b981;
      --color-warning: #f59e0b;

      --color-bg-primary: #ffffff;
      --color-bg-secondary: #f8fafc;
      --color-bg-tertiary: #f1f5f9;

      --color-text-primary: #0f172a;
      --color-text-secondary: #475569;
      --color-text-tertiary: #94a3b8;

      --color-border: #e2e8f0;
      --color-border-light: #f1f5f9;

      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;

      --spacing-xs: 8px;
      --spacing-sm: 12px;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;

      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      padding: var(--spacing-md);
      color: var(--color-text-primary);
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 头部 */
    .header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: var(--spacing-xl);
      margin-bottom: var(--spacing-lg);
      box-shadow: var(--shadow-xl);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .header h1 {
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-sm);
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle {
      color: var(--color-text-secondary);
      font-size: 1.1rem;
      margin-bottom: var(--spacing-xs);
    }

    .header .meta {
      display: flex;
      gap: var(--spacing-md);
      flex-wrap: wrap;
      color: var(--color-text-tertiary);
      font-size: 0.9rem;
    }

    .header .meta-item {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    .header .badge {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    /* 统计卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }

    .stat-card:hover::before {
      transform: scaleX(1);
    }

    .stat-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-xl);
    }

    .stat-card .label {
      color: var(--color-text-tertiary);
      font-size: 0.9rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--spacing-sm);
    }

    .stat-card .value {
      font-size: 3rem;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: var(--spacing-xs);
      line-height: 1;
    }

    .stat-card .trend {
      font-size: 0.9rem;
      font-weight: 500;
    }

    .stat-card .trend.positive {
      color: var(--color-success);
    }

    .stat-card .trend.neutral {
      color: var(--color-secondary);
    }

    .stat-card .icon {
      position: absolute;
      top: var(--spacing-lg);
      right: var(--spacing-lg);
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--color-primary);
    }

    /* 筛选器 */
    .filters-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .filters-section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: var(--color-text-primary);
    }

    .filters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--spacing-lg);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xs);
    }

    .filter-group label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--color-text-secondary);
    }

    .filter-group input,
    .filter-group select {
      padding: 12px 16px;
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-family: var(--font-family);
      background: var(--color-bg-primary);
      color: var(--color-text-primary);
      transition: all 0.3s ease;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    /* 图表容器 */
    .charts-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: var(--spacing-xl);
      margin-bottom: var(--spacing-xl);
    }

    .chart-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      min-height: 450px;
    }

    .chart-container.wide {
      grid-column: 1 / -1;
    }

    .chart-container h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: var(--color-text-primary);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
    }

    .chart-container h2::before {
      content: '';
      width: 4px;
      height: 24px;
      background: linear-gradient(180deg, #6366f1, #8b5cf6);
      border-radius: 2px;
    }

    .chart-box {
      width: 100%;
      height: 400px;
    }

    /* 评论列表 */
    .reviews-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      margin-bottom: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .reviews-section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: var(--color-text-primary);
    }

    .review-item {
      background: var(--color-bg-secondary);
      border-radius: var(--radius-md);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      border-left: 4px solid var(--color-primary);
      transition: all 0.3s ease;
    }

    .review-item:hover {
      background: var(--color-bg-tertiary);
      transform: translateX(8px);
      box-shadow: var(--shadow-md);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-md);
      flex-wrap: wrap;
      gap: var(--spacing-sm);
    }

    .review-car {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    .review-keywords {
      display: flex;
      gap: var(--spacing-xs);
      flex-wrap: wrap;
    }

    .keyword-tag {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      color: var(--color-primary-dark);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .review-content {
      color: var(--color-text-secondary);
      font-size: 1.05rem;
      line-height: 1.7;
    }

    /* 下载按钮 */
    .download-section {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      margin-bottom: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .download-section h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--spacing-lg);
      color: var(--color-text-primary);
    }

    .download-buttons {
      display: flex;
      justify-content: center;
      gap: var(--spacing-lg);
      flex-wrap: wrap;
      margin-bottom: var(--spacing-md);
    }

    .download-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
    }

    .download-btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-xl);
      filter: brightness(1.1);
    }

    .download-btn:active {
      transform: translateY(-1px);
    }

    .download-btn .icon {
      font-size: 1.2rem;
    }

    .load-more {
      text-align: center;
      margin-top: var(--spacing-lg);
    }

    .load-more button {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
      color: var(--color-primary-dark);
      border: 2px solid var(--color-primary);
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .load-more button:hover {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* 加载状态 */
    .loading {
      text-align: center;
      padding: var(--spacing-2xl);
      color: var(--color-text-tertiary);
      font-size: 1.2rem;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--color-border-light);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto var(--spacing-lg);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* 响应式设计 */
    @media (max-width: 1024px) {
      .charts-section {
        grid-template-columns: 1fr;
      }

      .chart-container.wide {
        grid-column: auto;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: var(--spacing-sm);
      }

      .header {
        padding: var(--spacing-lg);
      }

      .header h1 {
        font-size: 1.5rem;
      }

      .stats-grid {
        grid-template-columns: 1fr;
        gap: var(--spacing-md);
      }

      .stat-card {
        padding: var(--spacing-md);
      }

      .stat-card .value {
        font-size: 2rem;
      }

      .filters-grid {
        grid-template-columns: 1fr;
        gap: var(--spacing-md);
      }

      .chart-container,
      .reviews-section,
      .download-section {
        padding: var(--spacing-lg);
      }

      .chart-box {
        height: 300px;
      }

      .download-buttons {
        flex-direction: column;
        align-items: stretch;
      }

      .review-header {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--spacing-sm);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: var(--spacing-xs);
      }

      .header {
        padding: var(--spacing-md);
      }

      .header .meta {
        flex-direction: column;
        gap: var(--spacing-xs);
      }

      .stat-card {
        padding: var(--spacing-sm);
      }

      .stat-card .value {
        font-size: 1.5rem;
      }

      .chart-box {
        height: 250px;
        padding: var(--spacing-sm);
      }

      .filters-section,
      .chart-container,
      .reviews-section,
      .download-section {
        padding: var(--spacing-md);
      }

      .review-item {
        padding: var(--spacing-md);
      }

      .download-btn,
      .load-more button {
        padding: 12px 24px;
        font-size: 0.9rem;
      }
    }

    /* 无障碍性增强 */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* 暗黑模式支持 */
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg-primary: #1e293b;
        --color-bg-secondary: #334155;
        --color-bg-tertiary: #475569;

        --color-text-primary: #f1f5f9;
        --color-text-secondary: #cbd5e1;
        --color-text-tertiary: #94a3b8;

        --color-border: #334155;
        --color-border-light: #475569;
      }

      .header,
      .stat-card,
      .filters-section,
      .chart-container,
      .reviews-section,
      .download-section {
        background: rgba(30, 41, 59, 0.95);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .review-item {
        background: var(--color-bg-secondary);
      }

      .review-item:hover {
        background: var(--color-bg-tertiary);
      }

      .filter-group input,
      .filter-group select {
        background: var(--color-bg-secondary);
        color: var(--color-text-primary);
        border-color: var(--color-border);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🚗 座椅CMF评论分析仪表板</h1>
      <p class="subtitle">基于真实车主评论的CMF数据洞察平台</p>
      <div class="meta">
        <div class="meta-item">
          <span class="badge">📊 821条评论</span>
        </div>
        <div class="meta-item">
          <span class="badge">🚗 47个车型</span>
        </div>
        <div class="meta-item">
          <span class="badge">🎨 116个CMF关键词</span>
        </div>
      </div>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">总评论数</div>
        <div class="value" id="totalReviews">0</div>
        <div class="trend neutral">来自47个豪华车型</div>
        <div class="icon">📊</div>
      </div>
      <div class="stat-card">
        <div class="label">CMF相关评论</div>
        <div class="value" id="cmfReviews">0</div>
        <div class="trend positive" id="cmfPercentage">0%</div>
        <div class="icon">🎨</div>
      </div>
      <div class="stat-card">
        <div class="label">车型覆盖</div>
        <div class="value" id="carsCovered">0</div>
        <div class="trend neutral">豪华车型为主</div>
        <div class="icon">🚗</div>
      </div>
      <div class="stat-card">
        <div class="label">CMF关键词</div>
        <div class="value" id="keywordTypes">0</div>
        <div class="trend positive">涵盖颜色/材质/触感</div>
        <div class="icon">🏷️</div>
      </div>
    </div>

    <!-- 筛选器 -->
    <div class="filters-section">
      <h2>🔍 数据筛选</h2>
      <div class="filters-grid">
        <div class="filter-group">
          <label>关键词搜索</label>
          <input type="text" id="keywordSearch" placeholder="输入关键词如：座椅、真皮、舒适">
        </div>
        <div class="filter-group">
          <label>车型筛选</label>
          <select id="carFilter">
            <option value="">全部车型</option>
          </select>
        </div>
        <div class="filter-group">
          <label>CMF维度</label>
          <select id="cmfFilter">
            <option value="">全部维度</option>
            <option value="color">🎨 颜色</option>
            <option value="material">🧵 材质</option>
            <option value="touch">✋ 触感</option>
            <option value="comfort">💆 舒适</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 图表区域 -->
    <div class="charts-section">
      <div class="chart-container wide">
        <h2>📊 按车型分布</h2>
        <div class="chart-box" id="carDistribution"></div>
      </div>
      <div class="chart-container">
        <h2>🔥 Top 10 CMF关键词</h2>
        <div class="chart-box" id="keywordChart"></div>
      </div>
      <div class="chart-container">
        <h2>🎯 CMF维度分析</h2>
        <div class="chart-box" id="cmfAnalysis"></div>
      </div>
      <div class="chart-container">
        <h2>📈 车型评论量对比</h2>
        <div class="chart-box" id="carComparison"></div>
      </div>
    </div>

    <!-- 评论列表 -->
    <div class="reviews-section">
      <h2>💬 CMF评论详情</h2>
      <div id="reviewsList">
        <div class="loading">
          <div class="loading-spinner"></div>
          <div>正在加载数据...</div>
        </div>
      </div>
      <div class="load-more">
        <button onclick="loadMoreReviews()">📝 加载更多评论</button>
      </div>
    </div>

    <!-- 下载区域 -->
    <div class="download-section">
      <h2>📥 数据下载</h2>
      <div class="download-buttons">
        <button class="download-btn" onclick="downloadJSON()">
          <span class="icon">📄</span>
          JSON格式
        </button>
        <button class="download-btn" onclick="downloadCSV()">
          <span class="icon">📊</span>
          CSV格式
        </button>
        <button class="download-btn" onclick="downloadAnalysis()">
          <span class="icon">📈</span>
          分析报告
        </button>
      </div>
      <p style="color: var(--color-text-tertiary); font-size: 0.9rem; margin-top: var(--spacing-md);">
        📅 数据来源：汽车之家口碑 | 爬取时间：2026-05-19
      </p>
    </div>
  </div>

  <script>
    // 数据状态
    let allReviews=[];
    let filteredReviews=[];
    let currentDisplayCount=0;
    const REVIEWS_PER_PAGE=15;

    // CMF关键词分类
    const CMF_CATEGORIES={
      color: ['颜色','配色','棕色','黑色','白色','米色','红色','外观'],
      material: ['真皮','Nappa','Alcantara','材质','面料','皮','布','织物','皮革','合成皮','仿皮','布艺','麂皮','翻毛皮','材料'],
      touch: ['触感','手感','柔软','硬','触手可及','摸起来','手感好','触感细腻','手感细腻','触感冰凉','触感温润','质感很好','接触'],
      comfort: ['舒适','包裹性','柔软','支撑','腰托','腿托','头枕','座椅舒适','乘坐舒适','乘坐体验','乘坐感受','大沙发','零压云毯','舒适度','贴合']
    };

    // 初始化图表
    function initCharts() {
      // 车型分布图
      const carChart=echarts.init(document.getElementById('carDistribution'));
      carChart.setOption({

          },

        }],
        color: ['#6366f1','#8b5cf6','#a78bfa','#c084fc','#e879f9','#f0abfc','#f472b6','#fb7185','#fda4af','#feadad']
      });

      // 关键词图表
      const keywordChart=echarts.init(document.getElementById('keywordChart'));

        tooltip: {

          axisPointer: {type: 'shadow'}

        },

          axisLine: {lineStyle: {color: '#e2e8f0'}}
        },
        yAxis: {
          type: 'category',
          data: [],
          axisLabel: {color: '#64748b'},
          axisLine: {lineStyle: {color: '#e2e8f0'}},
          splitLine: {lineStyle: {color: '#f1f5f9'}}
        },
        series: [{
          type: 'bar',
          data: [],
          itemStyle: {
            borderRadius: [8,8,0,0],
            color: new echarts.graphic.LinearGradient(0,0,1,0,[
              {offset: 0,color: '#6366f1'},
              {offset: 1,color: '#8b5cf6'}
            ])
          }
        }]
      });

      // CMF维度分析
      const cmfAnalysis=echarts.init(document.getElementById('cmfAnalysis'));
      cmfAnalysis.setOption({
        tooltip: {trigger: 'axis'},
        legend: {
          data: ['颜色','材质','触感','舒适'],
          textStyle: {color: '#475569'}
        },
        grid: {
          left: '8%',
          right: '4%',
          bottom: '3%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          data: [],
          axisLabel: {
            color: '#64748b',
            rotate: 45
          },
          axisLine: {lineStyle: {color: '#e2e8f0'}}
        },
        yAxis: {
          type: 'value',
          axisLabel: {color: '#64748b'},
          axisLine: {lineStyle: {color: '#e2e8f0'}},
          splitLine: {lineStyle: {color: '#f1f5f9'}}
        },
        series: [
          {
            name: '颜色',
            type: 'bar',
            stack: 'cmf',
            data: [],
            itemStyle: {color: '#f97316'}
          },
          {
            name: '材质',
            type: 'bar',
            stack: 'cmf',
            data: [],
            itemStyle: {color: '#3b82f6'}
          },
          {
            name: '触感',
            type: 'bar',
            stack: 'cmf',

          },
          {
            name: '舒适',
            type: 'bar',
            stack: 'cmf',
            data: [],

          }
        ]

      // 车型对比图
      const carComparison=echarts.init(document.getElementById('carComparison'));
      carComparison.setOption({
        tooltip: {
          trigger: 'axis',
          axisPointer: {type: 'shadow'}
        },
        grid: {
          left: '8%',
          right: '4%',
          bottom: '3%',
          containLabel: true
        },
        xAxis: {
          type: 'category',
          data: [],
          axisLabel: {
            color: '#64748b',
            rotate: 60,
            fontSize: 10
          },
          axisLine: {lineStyle: {color: '#e2e8f0'}}
        },
        yAxis: {
          type: 'value',
          axisLabel: {color: '#64748b'},
          axisLine: {lineStyle: {color: '#e2e8f0'}},
          splitLine: {lineStyle: {color: '#f1f5f9'}}
        },
        series: [{
          type: 'bar',
          data: [],
          itemStyle: {
            borderRadius: [8,8,0,0],

      return {carChart,keywordChart,cmfAnalysis,carComparison};
    }

    // 加载数据
    async function loadData() {
      try {
        const response=await fetch('./output/cmf_seat_reviews_batch.json');
        const data=await response.json();

        allReviews=data.reviews||[];
        filteredReviews=[...allReviews];

        updateStats();
        updateCharts();
        updateCarFilter();
        renderReviews();

      } catch(error) {
        console.error('加载数据失败:',error);
        document.getElementById('reviewsList').innerHTML=`
          <div style="text-align: center; padding: 60px 20px; color: #dc2626;">
            <div style="font-size: 4rem; margin-bottom: 20px;">❌</div>
            <div style="font-size: 1.2rem; font-weight: 600; margin-bottom: 12px;">数据加载失败</div>
            <div style="color: #6b7280; font-size: 0.95rem;">请确保HTTP服务器正在运行 (http://localhost:8108)</div>
          </div>
        `;
      }
    }

    // 更新统计信息
    function updateStats() {
      const total=allReviews.length;
      const uniqueCars=new Set(allReviews.map(r => r.car)).size;
      const uniqueKeywords=new Set();
      allReviews.forEach(r => {
        (r.keywords||[]).forEach(k => uniqueKeywords.add(k));
      });

      // 动画数字增长效果
      animateValue('totalReviews',0,total,2000);
      animateValue('cmfReviews',0,total,2000);
      animateValue('carsCovered',0,uniqueCars,1500);
      animateValue('keywordTypes',0,uniqueKeywords.size,1800);

      document.getElementById('cmfPercentage').textContent='100%';
    }

    // 数字增长动画
    function animateValue(elementId,start,end,duration) {
      const element=document.getElementById(elementId);
      const range=end-start;
      const startTime=performance.now();

      function update(currentTime) {
        const elapsed=currentTime-startTime;
        const progress=Math.min(elapsed/duration,1);
        const easeProgress=1-Math.pow(1-progress,3); // easeOutCubic

        const current=Math.floor(start+range*easeProgress);
        element.textContent=current.toLocaleString();

        if(progress<1) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);
    }

    // 更新图表
    function updateCharts() {
      const charts=initCharts();

      // 车型分布数据
      const carStats={};
      allReviews.forEach(r => {
        carStats[r.car]=(carStats[r.car]||0)+1;
      });

      const carData=Object.entries(carStats)
        .sort((a,b) => b[1]-a[1])
        .map(([name,count]) => ({value: count,name}));

      charts.carChart.setOption({
        series: [{data: carData}]
      });

      // 关键词统计
      const keywordStats={};
      allReviews.forEach(r => {
        (r.keywords||[]).forEach(k => {
          keywordStats[k]=(keywordStats[k]||0)+1;
        });
      });

      const topKeywords=Object.entries(keywordStats)
        .sort((a,b) => b[1]-a[1])
        .slice(0,10);

      charts.keywordChart.setOption({
        yAxis: {data: topKeywords.map(k => k[0])},
        series: [{
          data: topKeywords.map(k => ({value: k[1],name: k[0]}))
        }]
      });

      // CMF维度分析
      const topCars=Object.entries(carStats)
        .sort((a,b) => b[1]-a[1])
        .slice(0,8)
        .map(k => k[0]);

      const cmfData={color: [],material: [],touch: [],comfort: []};

      topCars.forEach(car => {
        Object.entries(CMF_CATEGORIES).forEach(([category,keywords]) => {
          let count=0;
          allReviews
            .filter(r => r.car===car)
            .forEach(r => {
              (r.keywords||[]).forEach(kw => {
                if(keywords.includes(kw)) {
                  count++;
                }
              });
            });
          cmfData[category].push(count);
        });
      });

      charts.cmfAnalysis.setOption({
        xAxis: {data: topCars},
        series: [
          {name: '颜色',data: cmfData.color},
          {name: '材质',data: cmfData.material},
          {name: '触感',data: cmfData.touch},
          {name: '舒适',data: cmfData.comfort}
        ]
      });

      // 车型对比
      charts.carComparison.setOption({
        xAxis: {data: topCars},
        series: [{
          data: topCars.map(car => carStats[car])
        }]
      });

      // 响应式调整
      const resizeCharts=() => {
        Object.values(charts).forEach(chart => chart.resize());
      };

      window.addEventListener('resize',resizeCharts);
      setTimeout(resizeCharts,100);
    }

    // 更新车型筛选器
    function updateCarFilter() {
      const carSelect=document.getElementById('carFilter');
      const uniqueCars=new Set(allReviews.map(r => r.car));

      carSelect.innerHTML='<option value="">全部车型</option>';

      const sortedCars=Array.from(uniqueCars).sort();
      sortedCars.forEach(car => {
        carSelect.innerHTML+=`<option value="${car}">${car}</option>`;
      });
    }

    // 筛选功能
    function applyFilters() {
      const keywordSearch=document.getElementById('keywordSearch').value.toLowerCase();
      const carFilter=document.getElementById('carFilter').value;
      const cmfFilter=document.getElementById('cmfFilter').value;

      filteredReviews=allReviews.filter(review => {
        // 关键词搜索
        if(keywordSearch&&!review.content.toLowerCase().includes(keywordSearch)) {
          return false;
        }

        // 车型筛选
        if(carFilter&&review.car!==carFilter) {
          return false;
        }

        // CMF维度筛选
        if(cmfFilter) {
          const categoryKeywords=CMF_CATEGORIES[cmfFilter]||[];
          const hasCategory=(review.keywords||[]).some(kw =>
            categoryKeywords.includes(kw)
          );
          if(!hasCategory) {
            return false;
          }
        }

        return true;
      });

      currentDisplayCount=0;
      renderReviews();
      updateCharts();
    }

    // 渲染评论列表
    function renderReviews() {
      const container=document.getElementById('reviewsList');
      const reviewsToShow=filteredReviews.slice(currentDisplayCount,currentDisplayCount+REVIEWS_PER_PAGE);

      if(currentDisplayCount===0) {
        container.innerHTML='';
      }

      if(reviewsToShow.length===0&&currentDisplayCount===0) {
        container.innerHTML=`
          <div style="text-align: center; padding: 60px 20px; color: #6b7280;">
            <div style="font-size: 4rem; margin-bottom: 16px;">🔍</div>
            <div style="font-size: 1.2rem; font-weight: 600; color: #374151; margin-bottom: 8px;">未找到匹配的评论</div>
            <div style="font-size: 0.95rem;">请尝试调整筛选条件</div>
          </div>
        `;
        return;
      }

      reviewsToShow.forEach(review => {
        const keywordsHtml=(review.keywords||[]).slice(0,5).map(kw =>
          `<span class="keyword-tag">${kw}</span>`
        ).join('');

        const reviewItem=document.createElement('div');
        reviewItem.className='review-item';
        reviewItem.innerHTML=`
          <div class="review-header">
            <span class="review-car">🚗 ${review.car}</span>
            <span class="review-keywords">${keywordsHtml}</span>
          </div>
          <div class="review-content">${review.content}</div>
        `;
        container.appendChild(reviewItem);
      });

      currentDisplayCount+=reviewsToShow.length;
    }

    // 加载更多评论
    function loadMoreReviews() {
      renderReviews();
    }

    // 下载JSON
    function downloadJSON() {
      const dataStr=JSON.stringify(filteredReviews,null,2);
      const blob=new Blob([dataStr],{type: 'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`cmf_seat_reviews_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 下载CSV
    function downloadCSV() {
      const headers=['车型','关键词','内容','来源','时间'];
      const csvContent=[
        headers.join(','),
        ...filteredReviews.map(r => [
          `"${r.car}"`,
          `"${(r.keywords||[]).join(';')}"`,
          `"${r.content.replace(/"/g,'""')}"`,
          `"${r.source}"`,
          `"${r.timestamp}"`
        ].join(','))
      ].join('\n');

      const blob=new Blob(['\ufeff'+csvContent],{type: 'text/csv;charset=utf-8;'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`cmf_seat_reviews_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 下载分析报告
    function downloadAnalysis() {
      const carStats={};
      const keywordStats={};
      const cmfStats={'颜色': 0,'材质': 0,'触感': 0,'舒适': 0};

      filteredReviews.forEach(r => {
        // 车型统计
        carStats[r.car]=(carStats[r.car]||0)+1;

        // 关键词统计
        (r.keywords||[]).forEach(kw => {
          keywordStats[kw]=(keywordStats[kw]||0)+1;
        });

        // CMF维度统计
        Object.entries(CMF_CATEGORIES).forEach(([category,keywords]) => {
          const chineseCategory={
            color: '颜色',material: '材质',touch: '触感',comfort: '舒适'
          }[category];

          const hasCategory=keywords.some(kw =>
            (r.keywords||[]).includes(kw)
          );

          if(hasCategory&&chineseCategory) {
            cmfStats[chineseCategory]=(cmfStats[chineseCategory]||0)+1;
          }
        });
      });

      const report={
        生成时间: new Date().toISOString(),
        数据摘要: {
          总评论数: filteredReviews.length,
          车型数量: Object.keys(carStats).length,
          关键词类型: Object.keys(keywordStats).length
        },
        车型分布: carStats,
        关键词统计: Object.entries(keywordStats)
          .sort((a,b) => b[1]-a[1])
          .reduce((obj,[kw,count]) => {
            obj[kw]=count;
            return obj;
          },{}),
        CMF维度分析: cmfStats,
        数据样本: filteredReviews.slice(0,50)
      };

      const dataStr=JSON.stringify(report,null,2);
      const blob=new Blob([dataStr],{type: 'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`cmf_analysis_report_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 事件监听
    document.getElementById('keywordSearch').addEventListener('input',applyFilters);
    document.getElementById('carFilter').addEventListener('change',applyFilters);
    document.getElementById('cmfFilter').addEventListener('change',applyFilters);

    // 页面加载
    window.addEventListener('load',() => {
      loadData();
    });
  </script>
