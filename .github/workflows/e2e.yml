name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install chromium

      - run: npm run build

      - run: npm link

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          XBROWSER_REGISTRY: https://xbrowser-marketplace.dyyz1993.workers.dev
          XBROWSER_CHROMIUM_PATH: ''
