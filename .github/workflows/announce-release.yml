name: Render release tweet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.30.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: announce-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  render-major-release-tweet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG_NAME: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_BODY: ${{ github.event.release.body }}
    steps:
      - name: Check version class
        id: version
        run: |
          set -e
          TAG="${TAG_NAME#v}"
          if ! echo "$TAG" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "announce=false" >> "$GITHUB_OUTPUT"
            echo "Patch/prerelease or invalid tag; no announcement: $TAG_NAME"
            exit 0
          fi
          PATCH=$(echo "$TAG" | cut -d. -f3)
          if [ "$PATCH" != "0" ]; then
            echo "announce=false" >> "$GITHUB_OUTPUT"
            echo "Patch release; no announcement: $TAG_NAME"
            exit 0
          fi
          echo "announce=true" >> "$GITHUB_OUTPUT"
          echo "Major/minor release; announcement enabled: $TAG_NAME"

      - name: Load release metadata for manual runs
        if: github.event_name == 'workflow_dispatch' && steps.version.outputs.announce == 'true'
        run: |
          set -e
          METADATA=$(gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --json name,body)
          NAME=$(node -e 'const x=JSON.parse(process.argv[1]);console.log(x.name||"")' "$METADATA")
          BODY=$(node -e 'const x=JSON.parse(process.argv[1]);console.log(x.body||"")' "$METADATA")
          {
            echo "RELEASE_NAME<<EOF"
            echo "$NAME"
            echo "EOF"
            echo "RELEASE_BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Render announcement
        id: render
        if: steps.version.outputs.announce == 'true'
        run: |
          set -e
          mkdir -p output/twitter
          NAME="${RELEASE_NAME:-@xbrowser/cli v${TAG_NAME#v}}"
          HIGHLIGHTS=$(printf '%s' "$RELEASE_BODY" | awk '/^## Highlights/{in_section=1;next} /^## /{in_section=0} in_section && /^- /{sub(/^- /,"");print}')
          BODY=$(printf '%s' "$HIGHLIGHTS" | head -n 3 | tr '\n' '|' | sed 's/[[:space:]]\+/ /g;s/|/ · /g;s/^ //;s/ $//')
          if [ -z "$BODY" ]; then
            BODY=$(printf '%s' "$RELEASE_BODY" | sed -e 's/\r$//' -e '/^## /,$d' | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/^ //;s/ $//')
          fi
          TWEET="🚀 ${NAME} is live: ${BODY} npm: https://www.npmjs.com/package/@xbrowser/cli?activeTab=versions"
          TWEET=$(node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const out=s.trim().replace(/\s+/g," ");console.log(out.slice(0,280))})' <<< "$TWEET")
          printf '%s' "$TWEET" > output/twitter/tweet.txt
          echo "Rendered (${#TWEET} chars):"
          cat output/twitter/tweet.txt
          {
            echo "tweet<<EOF"
            echo "$TWEET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Rendered release tweet"
            echo
            echo '```text'
            echo "$TWEET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tweet for local publishing
        if: steps.version.outputs.announce == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-tweet
          path: output/twitter/tweet.txt
          retention-days: 7
