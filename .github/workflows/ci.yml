name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # nightly arena at 18:30 UTC (P1-5)
    - cron: '30 18 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:plugins
      - run: npm run lint
      - run: npm run lint:plugins
      - run: npm run lint:plugin-contract
      # 与 husky pre-commit 同源的文档一致性检查（防 --no-verify 绕过）
      - run: npm run lint:docs

  commit-lint:
    # 与 husky commit-msg 同源的提交信息格式检查（防 --no-verify 绕过：
    # 本地钩子可被跳过，CI 是不可绕的最后一道）。
    name: commit-message-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit message format
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="${{ github.sha }}~1..${{ github.sha }}"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi
          echo "Checking range: $RANGE"
          FAIL=0
          for sha in $(git rev-list "$RANGE"); do
            MSG=$(git log -1 --format=%s "$sha")
            # GitHub 自动生成的 merge commit 豁免
            case "$MSG" in "Merge "*) echo "⏭ skip merge: $MSG"; continue;; esac
            if ! echo "$MSG" | grep -qE "^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?: .{1,80}"; then
              echo "❌ [$sha] 非 conventional 格式: $MSG"; FAIL=1
            fi
            LEN=$(echo -n "$MSG" | wc -c | tr -d ' ')
            if [ "$LEN" -gt 100 ]; then
              echo "❌ [$sha] 首行过长（$LEN>100）: $MSG"; FAIL=1
            fi
            echo "✓ [$sha] $MSG"
          done
          exit $FAIL

  test:
    runs-on: ubuntu-latest
    # 全量测试（3797+ 用例，含 arena 逐用例浏览器隔离）本地纯测试已 ~20 分钟；
    # CI 带 coverage + build + 慢机，15 分钟预算下 test job 从未跑完过（超时被
    # 标记 cancelled，是 2026-08 末以来 CI 持续红的主因之一）。
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm run build
      - run: npm link
      - run: npm test -- --coverage
        env:
          XBROWSER_CHROMIUM_PATH: ''

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == 22
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: ./coverage/

  arena-nightly:
    # P1-5: full production arena (~634s) — nightly + manual, NOT per-PR
    name: arena-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm run build
      - run: npm link
      - run: npm run test:arena
        env:
          XBROWSER_CHROMIUM_PATH: ''
      - name: Upload arena diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arena-failure-diagnostics
          path: |
            ~/.xbrowser/sessions/**/*.json
            output/
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

  scrape-test:
    needs: build
    runs-on: ubuntu-latest
    # 外网冒烟（爬 example.com）——时快时慢不稳定，cancelled/failure 不应
    # 阻塞主链路；发布门槛是 lint/typecheck/test/build 四个核心 job。
    continue-on-error: true
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm link
      - name: Test scrape command
        run: |
          xbrowser scrape https://example.com --format markdown 2>&1 | head -20
          echo "Scrape test passed"
      - name: Test map command
        run: |
          xbrowser map https://example.com --json 2>&1 | jq '.links | length'
          echo "Map test passed"
