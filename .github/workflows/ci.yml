name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    # 全量测试（3797+ 用例，含 arena 逐用例浏览器隔离）本地纯测试已 ~20 分钟；
    # CI 带 coverage + build + 慢机，15 分钟预算下 test job 从未跑完过（超时被
    # 标记 cancelled，是 2026-08 末以来 CI 持续红的主因之一）。
    timeout-minutes: 60
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm run build
      - run: npm link
      - run: npm test -- --coverage
        env:
          XBROWSER_CHROMIUM_PATH: ''

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.node-version == 22
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.node-version }}
          path: ./coverage/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build

  scrape-test:
    needs: build
    runs-on: ubuntu-latest
    # 外网冒烟（爬 example.com）——时快时慢不稳定，cancelled/failure 不应
    # 阻塞主链路；发布门槛是 lint/typecheck/test/build 四个核心 job。
    continue-on-error: true
    timeout-minutes: 10
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm link
      - name: Test scrape command
        run: |
          xbrowser scrape https://example.com --format markdown 2>&1 | head -20
          echo "Scrape test passed"
      - name: Test map command
        run: |
          xbrowser map https://example.com --json 2>&1 | jq '.links | length'
          echo "Map test passed"
