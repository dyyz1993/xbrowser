name: Publish

on:
  push:
    branches: [master]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build

      # ── Smoke test: verify the built package actually starts ──
      # Catches ESM/CJS packaging bugs (e.g. require() in ESM output)
      # that typecheck + unit tests miss. v1.0.3 shipped broken because
      # this step didn't exist.
      - name: Smoke test — CLI must start
        run: |
          echo "Testing: node dist/cli.js --version"
          node dist/cli.js --version
          echo "Testing: node dist/cli.js --help"
          node dist/cli.js --help > /dev/null
          echo "Testing: node dist/index.js (module entry)"
          node -e "import('./dist/index.js').then(() => console.log('module import OK')).catch(e => { console.error(e); process.exit(1); })"
          echo "✅ All smoke tests passed"

      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
