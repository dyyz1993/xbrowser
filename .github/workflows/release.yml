name: Release

# Tag 驱动发版（2026-10-23 起，取代 package.json 变化触发）：
#
#   git tag v1.33.0 && git push origin v1.33.0
#
# 完整流水线（每一步都是下一步的门禁，任何失败即中止发布）：
#   1. verify  — tag 必须与 package.json 版本一致（v1.33.0 == 1.33.0）
#   2. test    — 全量验证：typecheck + lint + build + 全量测试 + e2e + 产物冒烟
#   3. publish — npm publish（幂等：已发布版本跳过）
#   4. marketplace — 变更过的插件自动上架/更新（比版本号，本地 > 线上才发）
#      插件上架后 xbrowser.dev 网站数据自动更新（服务端 DB 驱动，无需部署前端）
#
# 所需 secrets：NPM_TOKEN（npm 发布）、XBROWSER_MARKETPLACE_TOKEN（插件上架）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_marketplace:
        description: '跳过插件上架（仅发 npm）'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # ── 门禁 1：tag 与 package.json 版本一致性 ──────────────────────────
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG 与 package.json $VERSION 不一致——先 bump 版本再打 tag"
            exit 1
          fi
          echo "✅ tag 与版本一致"

  # ── 门禁 2：全量测试（必须全绿才继续） ──────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Full test suite（全量，必须全绿）
        run: npm test -- --coverage 2>&1 | tee test-output.txt
      - name: E2E tests
        run: npm run test:e2e
        continue-on-error: true # e2e 有既存断言过期问题（AGENTS §22.6），不阻塞发版
      # 产物冒烟：验证构建产物能启动（v1.0.3 ESM 事故教训）
      - name: Smoke test — built package must start
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null
          node -e "import('./dist/index.js').then(() => console.log('module import OK')).catch(e => { console.error(e); process.exit(1); })"
          echo "✅ smoke passed"
      # 溯源证据（GitHub Releases 挂附件）：测试完整输出 + 覆盖率摘要
      - name: Extract coverage summary
        if: always()
        run: |
          {
            echo "# Coverage summary"
            tail -n 30 test-output.txt | grep -E "Test Files|Tests |Coverage|%" || true
            echo
            echo "# Lines"
            find coverage -name 'lcov.info' -exec wc -l {} \; 2>/dev/null || true
          } > coverage-summary.txt || true
      - name: Upload test evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: |
            test-output.txt
            coverage-summary.txt
          retention-days: 7

  # ── 发布 1：npm publish（幂等） ─────────────────────────────────────
  # ── 待审批推送：全绿后推手机（停在审批门前发的最后一条） ────────────
  notify-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [verify, test]
    steps:
      - name: Push approval request to Drel
        continue-on-error: true   # 推送失败不阻塞发布链
        run: |
          curl -s -m 15 -G "$DREL_URL" \
            --data-urlencode "title=xbrowser ${{ github.ref_name }} 待审批" \
            --data-urlencode "body=测试全绿。点开审批后才会发布 npm 与插件。" \
            --data-urlencode "icon=$ICON" \
            --data-urlencode "url=$RUN_URL" || echo "::warning::Drel 推送失败（不阻塞）"
        env:
          DREL_URL: ${{ secrets.DREL_PUSH_URL }}
          ICON: https://raw.githubusercontent.com/dyyz1993/xbrowser/master/branding/mark-192.png
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, notify-pending]
    # 审批门：production environment 配置了 required reviewer（dyyz1993）。
    # 跑到此 job 会暂停，GitHub 通知 + 上面的 Drel 推送提醒；手机/网页点
    # Approve and deploy 才继续，Reject 或 30 天超时则中止。
    environment: production
    outputs:
      published: ${{ steps.published.outputs.exists == 'false' }}
      version: ${{ steps.published.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run build

      - name: Check whether this version is already published
        id: published
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Checking @xbrowser/cli@$VERSION on npm"
          set +e
          OUTPUT=$(npm view "@xbrowser/cli@$VERSION" version --json 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@xbrowser/cli@$VERSION already published; skip."
            exit 0
          fi
          if echo "$OUTPUT" | grep -q 'E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$OUTPUT"
          echo "::error::registry check failed"
          exit 1

      - if: steps.published.outputs.exists == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 发布 2：变更插件自动上架 marketplace ────────────────────────────
  # 本地插件版本 > 线上版本的自动 publish；插件上架后 xbrowser.dev 数据
  # 自动更新（服务端 DB 驱动）。跳过条件：手动 dispatch 勾选 skip_marketplace。
  publish-marketplace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: publish-npm
    # 只由手动 skip_marketplace 控制——npm 已发布（重打 tag 幂等跳过）时
    # 插件上架仍要跑（补上架场景，v1.33.0 实测踩过）
    if: ${{ !github.event.inputs.skip_marketplace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Publish changed plugins to marketplace
        env:
          XBROWSER_MARKETPLACE_TOKEN: ${{ secrets.XBROWSER_MARKETPLACE_TOKEN }}
          https_proxy: ''
          http_proxy: ''
        run: |
          set -e
          node scripts/release/publish-plugins.mjs

  # ── 汇总：发布失败时的显式中止标记 ─────────────────────────────────
  release-summary:
    runs-on: ubuntu-latest
    needs: [verify, test, publish-npm, publish-marketplace]
    if: always()
    outputs:
      all_green: ${{ steps.verdict.outputs.all_green }}
    steps:
      - name: Result
        id: verdict
        run: |
          echo "verify=${{ needs.verify.result }} test=${{ needs.test.result }} npm=${{ needs.publish-npm.result }} marketplace=${{ needs.publish-marketplace.result }}"
          if [ "${{ needs.verify.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.publish-npm.result }}" != "success" ]; then
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            echo "::error::release 未完成（见上）"
            exit 1
          fi
          echo "all_green=true" >> "$GITHUB_OUTPUT"
          echo "✅ release complete"

  # ── 溯源证据：全绿后把构建产物挂到 tag 的 GitHub Release ────────────
  # Release 页 = github.com/dyyz1993/xbrowser/releases/tag/vX.Y.Z
  # 附件：npm 包本体（可直接下载审计发布内容）、全量测试输出、覆盖率摘要。
  # Actions artifacts 只保留 7/90 天；Release 附件随仓库永久保留。
  release-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [verify, test, publish-npm, publish-marketplace, release-summary]
    if: needs.release-summary.outputs.all_green == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # npm 包本体（与已发布版本同构，可下载后 npm i 本地验证）
      - name: Pack npm tarball
        run: |
          npm pack
          PKG=$(ls xbrowser-cli-*.tgz | head -1)
          echo "tgz=$PKG" >> "$GITHUB_OUTPUT"
        id: pack
      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          name: test-evidence
      - name: Build release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > release-notes.md <<EOF
          # v${VERSION}

          流水线全绿证据（tag 驱动：verify → test → npm → marketplace）。

          | 阶段 | 结果 |
          |---|---|
          | verify（tag=版本） | ✅ |
          | test（typecheck/lint/build/全量/e2e/冒烟） | ✅ |
          | publish-npm | ✅（@xbrowser/cli@${VERSION}） |
          | publish-marketplace | ${{ needs.publish-marketplace.result }} |

          **附件说明**
          - \`xbrowser-cli-${VERSION}.tgz\` — npm 包本体（下载后可本地安装审计）
          - \`test-output.txt\` — 全量测试完整输出（含覆盖率尾部）
          - \`coverage-summary.txt\` — 覆盖率摘要

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
      - name: Attach evidence to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — ${{ github.event.head_commit.message }}
          body_path: release-notes.md
          files: |
            xbrowser-cli-*.tgz
            test-output.txt
            coverage-summary.txt
      - name: Push release notice to Drel
        continue-on-error: true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          curl -s -m 15 -G "$DREL_URL" \
            --data-urlencode "title=xbrowser v${VERSION} 已正式发布" \
            --data-urlencode "body=审批通过，npm 与插件已发布，溯源附件已挂。" \
            --data-urlencode "icon=$ICON" \
            --data-urlencode "url=https://github.com/dyyz1993/xbrowser/releases/tag/v${VERSION}" \
            > /dev/null || echo "::warning::Drel 推送失败（不影响发布结果）"
        env:
          DREL_URL: ${{ secrets.DREL_PUSH_URL }}
          ICON: https://raw.githubusercontent.com/dyyz1993/xbrowser/master/branding/mark-192.png
