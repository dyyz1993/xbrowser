<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xbrowser Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: #2d2d2d;
      padding: 10px 20px;
      border-bottom: 1px solid #404040;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 { font-size: 16px; font-weight: 600; }

    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ff4444;
      transition: background 0.3s;
    }
    .status-dot.connected { background: #4caf50; }

    .captcha-banner {
      display: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s;
    }
    .captcha-banner.active { display: block; }
    .captcha-banner.detected { background: #d32f2f; color: #fff; }
    .captcha-banner.resolved { background: #2e7d32; color: #fff; }

    .captcha-banner .countdown { font-size: 12px; opacity: 0.85; margin-top: 4px; }

    .url-bar {
      background: #252525;
      padding: 6px 16px;
      border-bottom: 1px solid #404040;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .url-bar .url-icon { color: #888; }
    .url-bar .url-text { color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .main { flex: 1; display: flex; overflow: hidden; }

    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 16px;
      position: relative;
      cursor: crosshair;
    }

    .viewport img {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid #404040;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      user-select: none;
      -webkit-user-drag: none;
    }

    .viewport .placeholder { color: #666; font-size: 14px; }

    .click-indicator {
      position: absolute;
      width: 20px; height: 20px;
      border: 2px solid #4caf50;
      border-radius: 50%;
      pointer-events: none;
      animation: click-ripple 0.6s ease-out forwards;
    }
    @keyframes click-ripple {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }

    .sidebar {
      width: 280px;
      background: #2d2d2d;
      border-left: 1px solid #404040;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 12px;
      border-bottom: 1px solid #404040;
      font-weight: 600;
      font-size: 13px;
    }

    .info {
      padding: 10px 12px;
      border-bottom: 1px solid #404040;
      font-size: 12px;
    }

    .info-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .info-label { color: #888; }
    .info-value { color: #e0e0e0; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .controls { display: flex; gap: 6px; margin-top: 8px; }
    .controls button {
      background: #4a4a4a; border: none; color: #fff;
      padding: 5px 10px; border-radius: 4px; cursor: pointer;
      font-size: 11px; transition: background 0.2s;
    }
    .controls button:hover { background: #5a5a5a; }
    .controls button.active { background: #4caf50; }
    .controls button.danger { background: #d32f2f; }
    .controls button.danger:hover { background: #b71c1c; }

    .captcha-status {
      padding: 10px 12px;
      border-bottom: 1px solid #404040;
      font-size: 12px;
      display: none;
    }
    .captcha-status.active { display: block; }
    .captcha-status .label { color: #ff9800; font-weight: 600; margin-bottom: 4px; }
    .captcha-status .detail { color: #aaa; }

    .sidebar-content {
      flex: 1; overflow-y: auto; padding: 10px;
    }

    .command-item {
      background: #3d3d3d; border-radius: 6px; padding: 8px;
      margin-bottom: 6px; font-size: 11px; border-left: 3px solid #4caf50;
    }
    .command-item.error { border-left-color: #ff4444; }
    .command-item .command { color: #fff; font-weight: 500; margin-bottom: 3px; }
    .command-item .timestamp { color: #888; font-size: 10px; margin-bottom: 3px; }
    .command-item .result { color: #4caf50; word-break: break-all; }
    .command-item .error-msg { color: #ff4444; }

    .keyboard-hint {
      position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(45,45,45,0.9); padding: 4px 12px; border-radius: 4px;
      font-size: 11px; color: #888; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>xbrowser Preview</h1>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <div class="captcha-banner" id="captcha-banner">
    <div class="banner-text" id="captcha-banner-text"></div>
    <div class="countdown" id="captcha-countdown"></div>
  </div>

  <div class="url-bar">
    <span class="url-icon">&#128279;</span>
    <span class="url-text" id="current-url">No page loaded</span>
  </div>

  <div class="main">
    <div class="viewport" id="viewport" tabindex="0">
      <div class="placeholder">Waiting for screenshots...</div>
    </div>

    <div class="sidebar">
      <div class="info">
        <div class="info-row">
          <span class="info-label">Session:</span>
          <span class="info-value" id="session-id">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Viewport:</span>
          <span class="info-value" id="viewport-size">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Last Update:</span>
          <span class="info-value" id="last-update">-</span>
        </div>
        <div class="controls">
          <button id="btn-auto" class="active">Auto: ON</button>
          <button id="btn-clear">Clear</button>
          <button id="btn-solved" class="danger" style="display:none">Mark Solved</button>
        </div>
      </div>

      <div class="captcha-status" id="captcha-status">
        <div class="label" id="captcha-type">-</div>
        <div class="detail" id="captcha-reason">-</div>
      </div>

      <div class="sidebar-header">Command History</div>
      <div class="sidebar-content" id="command-log">
        <div style="color: #888; font-size: 12px; text-align: center; padding: 20px;">
          No commands yet
        </div>
      </div>
    </div>
  </div>

  <div class="keyboard-hint">Click viewport to focus — keyboard events are forwarded</div>

  <script>
    const WS_URL = `ws://${location.hostname}:9223`;
    let ws = null;
    let connected = false;
    let autoRefresh = true;
    let sessionId = null;
    let viewportSize = { width: 0, height: 0 };
    let captchaTimeout = null;
    let captchaDeadline = null;

    const $ = (id) => document.getElementById(id);
    const statusDot = $('status-dot');
    const statusText = $('status-text');
    const viewport = $('viewport');
    const sessionIdEl = $('session-id');
    const viewportSizeEl = $('viewport-size');
    const lastUpdateEl = $('last-update');
    const commandLog = $('command-log');
    const btnAuto = $('btn-auto');
    const btnClear = $('btn-clear');
    const btnSolved = $('btn-solved');
    const captchaBanner = $('captcha-banner');
    const captchaBannerText = $('captcha-banner-text');
    const captchaCountdown = $('captcha-countdown');
    const currentUrl = $('current-url');
    const captchaStatus = $('captcha-status');
    const captchaType = $('captcha-type');
    const captchaReason = $('captcha-reason');

    function updateStatus(isConnected) {
      if (isConnected) {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
      } else {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';
      }
    }

    function formatTimestamp(ts) {
      return new Date(ts).toLocaleTimeString();
    }

    function updateScreenshot(data) {
      const existing = viewport.querySelector('img');
      if (existing) {
        existing.src = `data:image/jpeg;base64,${data}`;
      } else {
        const placeholder = viewport.querySelector('.placeholder');
        if (placeholder) placeholder.remove();
        const img = document.createElement('img');
        img.src = `data:image/jpeg;base64,${data}`;
        img.alt = 'Browser preview';
        img.draggable = false;
        setupImageInteraction(img);
        viewport.appendChild(img);
      }
      lastUpdateEl.textContent = formatTimestamp(Date.now());
    }

    function setupImageInteraction(img) {
      img.addEventListener('click', (e) => {
        e.preventDefault();
        const rect = img.getBoundingClientRect();
        const displayX = e.clientX - rect.left;
        const displayY = e.clientY - rect.top;

        if (viewportSize.width === 0 || viewportSize.height === 0) return;

        const scaleX = viewportSize.width / rect.width;
        const scaleY = viewportSize.height / rect.height;
        const actualX = Math.round(displayX * scaleX);
        const actualY = Math.round(displayY * scaleY);

        const indicator = document.createElement('div');
        indicator.className = 'click-indicator';
        indicator.style.left = `${e.clientX - viewport.getBoundingClientRect().left - 10}px`;
        indicator.style.top = `${e.clientY - viewport.getBoundingClientRect().top - 10}px`;
        viewport.appendChild(indicator);
        setTimeout(() => indicator.remove(), 600);

        send({ type: 'click', x: actualX, y: actualY, button: 'left' });
      });

      img.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const rect = img.getBoundingClientRect();
        const displayX = e.clientX - rect.left;
        const displayY = e.clientY - rect.top;
        if (viewportSize.width === 0) return;
        const scaleX = viewportSize.width / rect.width;
        const scaleY = viewportSize.height / rect.height;
        send({ type: 'click', x: Math.round(displayX * scaleX), y: Math.round(displayY * scaleY), button: 'right' });
      });

      img.addEventListener('wheel', (e) => {
        e.preventDefault();
        send({ type: 'scroll', deltaX: e.deltaX, deltaY: e.deltaY });
      }, { passive: false });
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (!connected) return;

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        send({ type: 'type', text: e.key });
      } else {
        const key = e.key;
        if (['Enter', 'Tab', 'Escape', 'Backspace', 'Delete', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(key)) {
          send({ type: 'keypress', key });
        }
      }
      e.preventDefault();
    });

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    }

    function addCommandMessage(data) {
      if (commandLog.querySelector('div[style*="text-align: center"]')) {
        commandLog.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'command-item' + (data.error ? ' error' : '');

      let resultHtml = '';
      if (data.error) {
        resultHtml = `<div class="error-msg">${escapeHtml(data.error)}</div>`;
      } else if (data.result) {
        resultHtml = `<div class="result">${escapeHtml(typeof data.result === 'string' ? data.result : JSON.stringify(data.result))}</div>`;
      }

      item.innerHTML = `
        <div class="timestamp">${formatTimestamp(data.timestamp)}</div>
        <div class="command">${escapeHtml(data.command)}</div>
        ${resultHtml}
      `;

      commandLog.insertBefore(item, commandLog.firstChild);
      while (commandLog.children.length > 50) {
        commandLog.removeChild(commandLog.lastChild);
      }
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function showCaptchaDetected(data) {
      captchaBanner.className = 'captcha-banner active detected';
      captchaBannerText.textContent = `\u26A0\uFE0F CAPTCHA detected \u2014 Please solve it`;

      if (data.timeout > 0) {
        captchaDeadline = Date.now() + data.timeout * 1000;
        updateCountdown();
        captchaTimeout = setInterval(updateCountdown, 1000);
      } else {
        captchaCountdown.textContent = 'No timeout';
      }

      captchaStatus.className = 'captcha-status active';
      captchaType.textContent = data.reason || 'CAPTCHA';
      captchaReason.textContent = data.url || '';

      btnSolved.style.display = 'inline-block';
    }

    function updateCountdown() {
      if (!captchaDeadline) return;
      const remaining = Math.max(0, Math.ceil((captchaDeadline - Date.now()) / 1000));
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      captchaCountdown.textContent = remaining > 0
        ? `Timeout in ${m}:${s.toString().padStart(2, '0')}`
        : 'Timed out';
      if (remaining <= 0 && captchaTimeout) {
        clearInterval(captchaTimeout);
        captchaTimeout = null;
      }
    }

    function showResolved() {
      if (captchaTimeout) {
        clearInterval(captchaTimeout);
        captchaTimeout = null;
      }
      captchaDeadline = null;
      captchaBanner.className = 'captcha-banner active resolved';
      captchaBannerText.textContent = '\u2705 Resolved \u2014 Continuing...';
      captchaCountdown.textContent = '';
      btnSolved.style.display = 'none';

      setTimeout(() => {
        captchaBanner.className = 'captcha-banner';
        captchaStatus.className = 'captcha-status';
      }, 3000);
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connected = true;
        updateStatus(true);
        if (sessionId) {
          send({ type: 'bind', sessionId });
        }
      };

      ws.onclose = () => {
        connected = false;
        updateStatus(false);
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        connected = false;
        updateStatus(false);
      };

      ws.onmessage = (event) => {
        let message;
        try { message = JSON.parse(event.data); } catch { return; }

        switch (message.type) {
          case 'status':
            if (message.data && message.data.sessionId) {
              sessionId = message.data.sessionId;
              sessionIdEl.textContent = sessionId;
            }
            break;

          case 'screenshot':
            if (autoRefresh && message.data) {
              updateScreenshot(message.data.data);
              if (message.data.viewport) {
                viewportSize = message.data.viewport;
                viewportSizeEl.textContent = `${viewportSize.width}x${viewportSize.height}`;
              }
              if (message.data.url) {
                currentUrl.textContent = message.data.url;
              }
            }
            break;

          case 'command':
            if (message.data) addCommandMessage(message.data);
            break;

          case 'captcha-detected':
            showCaptchaDetected(message);
            break;

          case 'resolved':
            showResolved();
            break;
        }
      };
    }

    btnAuto.addEventListener('click', () => {
      autoRefresh = !autoRefresh;
      btnAuto.textContent = autoRefresh ? 'Auto: ON' : 'Auto: OFF';
      btnAuto.classList.toggle('active', autoRefresh);
    });

    btnClear.addEventListener('click', () => {
      commandLog.innerHTML = '<div style="color: #888; font-size: 12px; text-align: center; padding: 20px;">No commands yet</div>';
    });

    btnSolved.addEventListener('click', () => {
      send({ type: 'solved' });
    });

    viewport.addEventListener('focus', () => {
      viewport.style.outline = '2px solid #4caf50';
    });
    viewport.addEventListener('blur', () => {
      viewport.style.outline = 'none';
    });

    connect();
  </script>
</body>
</html>
