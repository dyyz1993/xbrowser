<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xbrowser Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: #2d2d2d;
      padding: 12px 20px;
      border-bottom: 1px solid #404040;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
    }

    .status-dot.connected {
      background: #4caf50;
    }

    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      padding: 20px;
      position: relative;
    }

    .viewport img {
      max-width: 100%;
      max-height: 100%;
      border: 1px solid #404040;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .viewport .placeholder {
      color: #666;
      font-size: 14px;
    }

    .sidebar {
      width: 300px;
      background: #2d2d2d;
      border-left: 1px solid #404040;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 12px;
      border-bottom: 1px solid #404040;
      font-weight: 600;
      font-size: 14px;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .command-item {
      background: #3d3d3d;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      border-left: 3px solid #4caf50;
    }

    .command-item.error {
      border-left-color: #ff4444;
    }

    .command-item .command {
      color: #fff;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .command-item .timestamp {
      color: #888;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .command-item .result {
      color: #4caf50;
      word-break: break-all;
    }

    .command-item .error-msg {
      color: #ff4444;
    }

    .info {
      padding: 12px;
      border-bottom: 1px solid #404040;
      font-size: 12px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .info-label {
      color: #888;
    }

    .info-value {
      color: #e0e0e0;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    .controls button {
      background: #4a4a4a;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }

    .controls button:hover {
      background: #5a5a5a;
    }

    .controls button.active {
      background: #4caf50;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>xbrowser Preview</h1>
    <div class="status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </div>

  <div class="main">
    <div class="viewport" id="viewport">
      <div class="placeholder">Waiting for screenshots...</div>
    </div>

    <div class="sidebar">
      <div class="info">
        <div class="info-row">
          <span class="info-label">Session:</span>
          <span class="info-value" id="session-id">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">URL:</span>
          <span class="info-value" id="page-url">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Viewport:</span>
          <span class="info-value" id="viewport-size">-</span>
        </div>
        <div class="info-row">
          <span class="info-label">Last Update:</span>
          <span class="info-value" id="last-update">-</span>
        </div>
        <div class="controls" style="margin-top: 12px;">
          <button id="btn-auto">Auto: ON</button>
          <button id="btn-clear">Clear</button>
        </div>
      </div>

      <div class="sidebar-header">Command History</div>
      <div class="sidebar-content" id="command-log">
        <div style="color: #888; font-size: 12px; text-align: center; padding: 20px;">
          No commands yet
        </div>
      </div>
    </div>
  </div>

  <script>
    const WS_URL = 'ws://localhost:9223';
    let ws = null;
    let connected = false;
    let autoRefresh = true;
    let sessionId = null;

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const viewport = document.getElementById('viewport');
    const sessionIdEl = document.getElementById('session-id');
    const pageUrlEl = document.getElementById('page-url');
    const viewportSizeEl = document.getElementById('viewport-size');
    const lastUpdateEl = document.getElementById('last-update');
    const commandLog = document.getElementById('command-log');
    const btnAuto = document.getElementById('btn-auto');
    const btnClear = document.getElementById('btn-clear');

    function updateStatus(connected) {
      if (connected) {
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected';
      } else {
        statusDot.classList.remove('connected');
        statusText.textContent = 'Disconnected';
      }
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleTimeString();
    }

    function updateScreenshot(data) {
      viewport.innerHTML = `<img src="data:image/jpeg;base64,${data}" alt="Browser preview" />`;
      lastUpdateEl.textContent = formatTimestamp(Date.now());
    }

    function addCommandMessage(data) {
      if (commandLog.querySelector('div[style*="text-align: center"]')) {
        commandLog.innerHTML = '';
      }

      const item = document.createElement('div');
      item.className = 'command-item' + (data.error ? ' error' : '');

      let resultHtml = '';
      if (data.error) {
        resultHtml = `<div class="error-msg">${data.error}</div>`;
      } else if (data.result) {
        resultHtml = `<div class="result">${JSON.stringify(data.result)}</div>`;
      }

      item.innerHTML = `
        <div class="timestamp">${formatTimestamp(data.timestamp)}</div>
        <div class="command">${data.command}</div>
        ${resultHtml}
      `;

      commandLog.insertBefore(item, commandLog.firstChild);

      // Keep only last 50 commands
      while (commandLog.children.length > 50) {
        commandLog.removeChild(commandLog.lastChild);
      }
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        connected = true;
        updateStatus(true);

        if (sessionId) {
          ws.send(JSON.stringify({ type: 'bind', sessionId }));
        }
      };

      ws.onclose = () => {
        connected = false;
        updateStatus(true);
        setTimeout(connect, 3000);
      };

      ws.onerror = () => {
        connected = false;
        updateStatus(false);
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);

        switch (message.type) {
          case 'status':
            if (message.data.sessionId) {
              sessionId = message.data.sessionId;
              sessionIdEl.textContent = sessionId;
            }
            break;

          case 'screenshot':
            const frame = message.data;
            if (autoRefresh) {
              updateScreenshot(frame.data);
            }
            pageUrlEl.textContent = frame.url;
            viewportSizeEl.textContent = `${frame.viewport.width}x${frame.viewport.height}`;
            break;

          case 'command':
            addCommandMessage(message.data);
            break;
        }
      };
    }

    btnAuto.addEventListener('click', () => {
      autoRefresh = !autoRefresh;
      btnAuto.textContent = autoRefresh ? 'Auto: ON' : 'Auto: OFF';
      btnAuto.classList.toggle('active', autoRefresh);
    });

    btnClear.addEventListener('click', () => {
      commandLog.innerHTML = '<div style="color: #888; font-size: 12px; text-align: center; padding: 20px;">No commands yet</div>';
    });

    // Start connection
    connect();
  </script>
</body>
</html>
