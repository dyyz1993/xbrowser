<!DOCTYPE html>
<html lang="en">
<head><title>New Tab Same Origin</title></head>
<body>
  <h1>New Tab Same Origin Test</h1>
  <button id="btn-main">Main Button</button>
  <script>
    // Auto-click main button after 2s
    setTimeout(function() {
      var btn = document.getElementById('btn-main');
      var rect = btn.getBoundingClientRect();
      btn.dispatchEvent(new MouseEvent('click', {
        bubbles: true, cancelable: true,
        clientX: rect.x + rect.width / 2,
        clientY: rect.y + rect.height / 2
      }));
    }, 2000);
    // Open same-origin page in new tab after 3s
    setTimeout(function() {
      window.open('/page-b.html', '_blank');
    }, 3000);
  </script>
</body>
</html>
