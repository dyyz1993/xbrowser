<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>D43 math-precision</title>
<style>body{font-family:system-ui;padding:30px;background:#fafafa;max-width:900px}
.check{margin:6px 0;padding:8px 14px;border-radius:8px;background:#fff;border:1px solid #ddd}
.pass{border-color:#27ae60}.fail{border-color:#e74c3c}
</style>
</head>
<body>
<h2>D43 — Math/精度指纹</h2>
<p>V8 浮点行为 —— Math.random 的熵、toFixed/toPrecision 输出、TypedArray 行为。</p>
<div id="log"></div>
<script>
window.__log = [];
function check() {
  var checks = [];
  var r = {};

  // 1. 基础浮点精度（IEEE 754 标准）
  checks.push({ name: '0.1 + 0.2 === 0.30000000000000004', ok: 0.1 + 0.2 === 0.30000000000000004 });
  checks.push({ name: 'Number.EPSILON = 2.22e-16', ok: Number.EPSILON === 2.220446049250313e-16 });
  checks.push({ name: 'Number.MAX_SAFE_INTEGER = 9007199254740991', ok: Number.MAX_SAFE_INTEGER === 9007199254740991 });

  // 2. toFixed 行为
  checks.push({ name: '(1.005).toFixed(2)', ok: (1.005).toFixed(2) === '1.00', detail: (1.005).toFixed(2) + '（银行家舍入）' });
  checks.push({ name: '(0.5).toFixed(0) = 1', ok: (0.5).toFixed(0) === '1' });
  checks.push({ name: '(1.5).toFixed(0) = 2', ok: (1.5).toFixed(0) === '2' });

  // 3. Math.random 熵
  var seen = new Set();
  for (var i = 0; i < 1000; i++) seen.add(Math.random());
  r.randomUnique = seen.size;
  checks.push({ name: 'Math.random 1000 次无重复', ok: seen.size === 1000, detail: seen.size + '/1000 唯一' });

  // 4. Math.random 值域
  var inRange = true;
  for (var j = 0; j < 100; j++) {
    var v = Math.random();
    if (v < 0 || v >= 1) { inRange = false; break; }
  }
  checks.push({ name: 'Math.random ∈ [0, 1)', ok: inRange });

  // 5. Math 函数精度（V8 特定值）
  checks.push({ name: 'Math.sin(0) === 0', ok: Math.sin(0) === 0 });
  checks.push({ name: 'Math.cos(0) === 1', ok: Math.cos(0) === 1 });
  var sqrt2 = Math.SQRT2;
  checks.push({ name: 'Math.SQRT2² ≈ 2', ok: Math.abs(sqrt2 * sqrt2 - 2) < 1e-15 });

  // 6. TypedArray 行为
  var f64 = new Float64Array([0.1, 0.2, 0.3]);
  checks.push({ name: 'Float64Array 精度一致', ok: f64[0] + f64[1] === 0.30000000000000004 });
  var i32 = new Int32Array([-1]);
  checks.push({ name: 'Int32Array(-1) >>> 0 = 4294967295', ok: (i32[0] >>> 0) === 4294967295 });

  // 7. JSON 数字序列化
  var jsonRound = JSON.parse(JSON.stringify(0.1 + 0.2));
  checks.push({ name: 'JSON 序列化保持精度', ok: jsonRound === 0.30000000000000004 });

  // 8. parseInt/parseFloat
  checks.push({ name: 'parseInt("0x1F") = 31', ok: parseInt('0x1F') === 31 });
  checks.push({ name: 'parseFloat("1e3") = 1000', ok: parseFloat('1e3') === 1000 });

  // 9. 大整数
  checks.push({ name: 'Number(9007199254740993) 精度丢失', ok: Number(9007199254740993) === 9007199254740992 });

  // 10. NaN/Infinity
  checks.push({ name: 'NaN !== NaN', ok: NaN !== NaN });
  checks.push({ name: 'typeof NaN = number', ok: typeof NaN === 'number' });
  checks.push({ name: 'Infinity + 1 = Infinity', ok: Infinity + 1 === Infinity });
  checks.push({ name: '-0 的字符串化 = "0"', ok: String(-0) === '0' && 1/-0 === -Infinity });

  window.__log.push({ action: 'check', allPass: checks.every(function (c) { return c.ok; }), checks: checks, r: r });
  render(checks);
}
function render(checks) {
  document.getElementById('log').innerHTML = checks.map(function (c) {
    return '<div class="check ' + (c.ok ? 'pass' : 'fail') + '">' + (c.ok ? '✓ ' : '✗ ') + c.name + ' <code>' + (c.detail || '') + '</code></div>';
  }).join('');
}
check();
window.__outcome = function () { return JSON.stringify({ page: 'd43', log: window.__log }); };
</script>
</body>
</html>
